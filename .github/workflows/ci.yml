name: CI

on:
  push:
    branches: [ main ]
    paths:
      - "containers/**"
      - "workflow/**"
      - "scripts/**"
      - "config/**"
      - "run_analysis.py"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}
  
jobs:
  toy-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t scrnaseq-pbmc-workflow:ci -f containers/Dockerfile .

      - name: Install wrapper requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r wrapper-requirements.txt

      - name: Download toy bundle
        run: python run_analysis.py download_toy

      - name: Run toy workflow (builds STAR index)
        run: |
          python run_analysis.py toy \
            --image scrnaseq-pbmc-workflow:ci \
            --cpus 2 --cores 2 -j 1

      - name: Assert outputs (toy_donor)
        run: |
          set -euo pipefail
          test -f data/ref/toy/whitelist.done
          test -f data/ref/toy/star_index_chr1/index.done
          test -f data/toy/toy_donor/fastqs.done
          test -f results/qc/fastqc/raw/toy_donor/fastqc.done
          test -f results/qc/multiqc/raw_toy/multiqc_report.html
          test -f results/alignment/starsolo/raw/toy_donor/starsolo.done
          test -s results/alignment/starsolo/raw/toy_donor/Solo.out/Gene/filtered/matrix.mtx
          echo "OK"

